      { label: "相似矩阵与对角化", href: "./md.html?file=study_note/math/相似矩阵与对角化.md" },
      { label: "若尔当标准形", href: "./md.html?file=study_note/math/若尔当标准形.md" },
      { label: "二次型", href: "./md.html?file=study_note/math/二次型.md" },
      { label: "正定矩阵", href: "./md.html?file=study_note/math/正定矩阵.md" },
      { label: "正交性", href: "./md.html?file=study_note/math/正交性.md" },
      { label: "QR 分解", href: "./md.html?file=study_note/math/QR分解.md" },
      { label: "LU 分解", href: "./md.html?file=study_note/math/LU分解.md" },
      { label: "Cholesky 分解", href: "./md.html?file=study_note/math/Cholesky分解.md" },
      { label: "SVD 奇异值分解", href: "./md.html?file=study_note/math/SVD奇异值分解.md" },
    ];

    function isMathFile(file) {
      return file.startsWith("study_note/math/") && file.endsWith(".md");
    }

    function isShaderFile(file) {
      return file.startsWith("study_note/shader/") && file.endsWith(".md");
    }

    function isDataStructFile(file) {
      return file.startsWith("study_note/data_struct/") && file.endsWith(".md");
    }

    function isStudyNoteFile(file) {
      return isMathFile(file) || isShaderFile(file) || isDataStructFile(file);
    }

    function loadMathJax() {
      if (window.MathJax) return Promise.resolve();
      return new Promise((resolve) => {
        window.MathJax = {
          tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
          startup: { ready: () => { MathJax.startup.defaultReady(); resolve(); } },
        };
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js";
        s.async = true;
        s.onerror = () => {
          const f = document.createElement("script");
          f.src = "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js";
          f.async = true;
          f.onload = resolve;
          document.head.appendChild(f);
        };
        s.onload = resolve;
        document.head.appendChild(s);
      });
    }

    const COPY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const CHECK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

    function addCodeCopyButtons(container) {
      container.querySelectorAll("pre").forEach((pre) => {
        const code = pre.querySelector("code");
        if (!code || pre.querySelector(".code-copy")) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "code-copy";
        btn.setAttribute("aria-label", "复制代码");
        btn.innerHTML = COPY_ICON + "<span>复制</span>";
        btn.addEventListener("click", async () => {
          const text = code.innerText;
          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(text);
            } else {
              const ta = document.createElement("textarea");
              ta.value = text;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
            }
            btn.classList.add("copied");
            btn.innerHTML = CHECK_ICON + "<span>已复制</span>";
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.innerHTML = COPY_ICON + "<span>复制</span>";
            }, 1600);
          } catch (err) {
            btn.innerHTML = COPY_ICON + "<span>失败</span>";
          }
        });
        pre.appendChild(btn);
      });
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, "-").replace(/^-|-$/g, "");
    }

    function addHeadingIds(container) {
      const used = new Set();
      container.querySelectorAll("h2, h3").forEach((h) => {
        let id = slugify(h.textContent);
        let n = 1;
        while (used.has(id)) { id = slugify(h.textContent) + "-" + (n++); }
        used.add(id);
        h.id = id;
      });
    }

    function setupStudySidebar(file, navItems, titleText) {
      const nav = document.getElementById("sidebarNav");
      const title = document.getElementById("sidebarTitle");
      title.textContent = titleText;

      const extra = document.createElement("div");
      extra.innerHTML = navItems.map((item) => {
        const active = item.href.includes(encodeURI(file)) ? " is-active" : "";
        return `<a href="${item.href}"${active ? ` class="${active.trim()}"` : ""}>${item.label}</a>`;
      }).join("");
      nav.appendChild(extra);
    }

    function syncHighlightTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const lightTheme = document.getElementById("highlight-light");
      const darkTheme = document.getElementById("highlight-dark");
      if (!lightTheme || !darkTheme) return;
      if (currentTheme === "dark") {
        lightTheme.disabled = true;
        darkTheme.disabled = false;
      } else {
        lightTheme.disabled = false;
        darkTheme.disabled = true;
      }
    }

    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch (err) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    function getFileParam() {
      const file = new URLSearchParams(location.search).get("file") || "";
      if (!file || file.includes("://") || file.startsWith("/") || file.includes("\\\\")) return "";
      return file;
    }

    async function load() {
      const file = getFileParam();
      const meta = document.getElementById("fileMeta");
      const md = document.getElementById("md");
      const openRaw = document.getElementById("openRaw");
      const noteCss = document.getElementById("noteCss");

      if (!file) {
        meta.textContent = "未指定文件";
        md.innerHTML = "<p class=\"muted\">用法：<code>md.html?file=study_note/math/公式速查.md</code>、<code>md.html?file=study_note/data_struct/速查.md</code> 或 <code>md.html?file=study_note/shader/速查.md</code></p>";
        openRaw.removeAttribute("href");
        return;
      }

      const math = isMathFile(file);
      const shader = isShaderFile(file);
      const dataStruct = isDataStructFile(file);
      const study = isStudyNoteFile(file);
      if (noteCss) noteCss.disabled = !study;
      if (study) md.classList.add("math-body");

      meta.textContent = file.split("/").pop();
      document.title = meta.textContent;
      openRaw.href = "./" + file;

      if (math) setupStudySidebar(file, MATH_NAV, "数学笔记");
      if (shader) setupStudySidebar(file, SHADER_NAV, "Shader 笔记");
      if (dataStruct) setupStudySidebar(file, DATA_STRUCT_NAV, "数据结构笔记");

      try {
        const resp = await fetch("./" + file);
        if (!resp.ok) throw new Error("文件加载失败");
        const text = await resp.text();
        md.innerHTML = marked.parse(text);
        document.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block));
        addHeadingIds(md);
        addCodeCopyButtons(md);

        if (study) {
          await loadMathJax();
          if (window.MathJax?.typesetPromise) await MathJax.typesetPromise([md]);
          const buildToc = dataStruct ? window.__buildDsToc : window.__buildMathToc;
          if (buildToc) {
            buildToc(md, document.getElementById("sidebarNav"));
            if (window.__initGroups) window.__initGroups();
          }
        }
      } catch (e) {
        md.innerHTML = "<p style=\"color:#ef4444\">内容加载失败：" + (e && e.message ? e.message : String(e)) + "</p>";
      }
    }

    syncHighlightTheme();
    const mo = new MutationObserver(syncHighlightTheme);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    load();
  </script>
</body>
