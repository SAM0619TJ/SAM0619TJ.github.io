<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Bash 基础命令 | Miyako 的学习笔记</title>
  <link rel="stylesheet" href="../assets/ui.css" />

  <!-- marked.js + highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="highlight-light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="highlight-dark" disabled>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script type="module">
    import { initSidebarUI, initThemeOnLoad } from "../assets/ui.js";
    initThemeOnLoad();
    initSidebarUI();
  </script>

  <style>
    /* 让 Markdown 渲染更像文章 */
    #markdown-content{max-width: 90ch}
    #markdown-content img{max-width:100%;height:auto}
    #markdown-content table{border-collapse:collapse;width:100%}
    #markdown-content th,#markdown-content td{border:1px solid var(--border);padding:8px;vertical-align:top}
    #markdown-content a{text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="打开菜单">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <div class="title">学习笔记</div>
          <div class="meta">Bash 基础命令</div>
        </div>
        <button class="iconbtn" type="button" id="themeBtn" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>

      <nav class="nav" aria-label="侧边栏导航">
        <a href="../orgin.html">返回首页</a>

        <div class="group" data-open="true">
          <button type="button" data-toggle>
            学习笔记
            <span class="chev" aria-hidden="true"></span>
          </button>
          <div class="submenu">
            <a href="./bash_base_command.html">Bash 基础命令</a>
            <a href="./math/index.html">数学笔记索引</a>
            <a href="./shader/index.html">Shader 笔记索引</a>
            <a href="../md.html?file=study_note/shader/速查.md">Shader 速查</a>
          </div>
        </div>

        <button class="nav" type="button" style="display:none"></button>
        <button class="iconbtn" type="button" id="langBtn" aria-label="切换语言">EN</button>
      </nav>
    </aside>

    <main class="content" id="main">
      <div class="wrap">
        <section class="card">
          <h1 id="page-title">Bash 基础命令</h1>
          <p class="muted" id="page-subtitle">Shell 命令行基础知识</p>
        </section>

        <section class="card prose">
          <div id="markdown-content">加载中...</div>
        </section>
      </div>
    </main>
  </div>

  <button class="backtop" id="backTop" type="button" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script>
    let currentLang = 'zh';

    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch (err) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    async function loadMarkdown(file) {
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('文件加载失败');
        const markdown = await response.text();
        const html = marked.parse(markdown);
        document.getElementById('markdown-content').innerHTML = html;
        document.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
      } catch (error) {
        document.getElementById('markdown-content').innerHTML =
          '<p style="color:#ef4444">内容加载失败：' + error.message + '</p>';
      }
    }

    function syncHighlightTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const lightTheme = document.getElementById('highlight-light');
      const darkTheme = document.getElementById('highlight-dark');
      if (!lightTheme || !darkTheme) return;
      if (currentTheme === 'dark') {
        lightTheme.disabled = true;
        darkTheme.disabled = false;
      } else {
        lightTheme.disabled = false;
        darkTheme.disabled = true;
      }
    }

    // 初始加载
    loadMarkdown('./base.md');
    syncHighlightTheme();

    // 语言切换
    document.getElementById('langBtn').addEventListener('click', () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中文';
      document.getElementById('page-title').textContent = currentLang === 'zh' ? 'Bash 基础命令' : 'Bash Basic Commands';
      document.getElementById('page-subtitle').textContent = currentLang === 'zh' ? 'Shell 命令行基础知识' : 'Shell command line basics';
      loadMarkdown(currentLang === 'zh' ? './base.md' : './base_en.md');
    });

    // 主题切换后同步代码高亮主题（监听 attribute 变化）
    const mo = new MutationObserver(syncHighlightTheme);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  </script>
</body>
</html>
